workflows:
  apk:
    name: TOLE2 Li APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      java: 17
    scripts:
      - npm install
      - npx cap add android
      - sed -i.bak 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Icono (si subes resources/icon.png)
        script: if [ -f resources/icon.png ]; then npx capacitor-assets generate --android; fi
      - npx cap sync android
      - cd android && chmod +x gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
